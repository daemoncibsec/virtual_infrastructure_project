- name: Instalar paquetes necesarios para LEMP (Nginx, PHP)
  apt:
    name:
      - nginx
      - php
      - php8.4-fpm
      - php-mysql
      - php-mbstring
      - git
    state: present
    update_cache: yes

- name: Configuración de virtualhost
  template: 
    src: etc/nginx/vhost.j2
    dest: /etc/nginx/sites-available/{{item["name"]}}.conf
    owner: root
    group: root
  with_items:
    - "{{virtualhosts}}"

- name: Crear DocumentRoot si no existe
  ansible.builtin.file:
    path: /{{item["datos"]["documentroot"]}}
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  with_items:
    - "{{virtualhosts}}"

