- name: Configurar PHP-FPM para usar el socket Unix
  lineinfile:
    path: "/etc/php/8.4/fpm/pool.d/www.conf"
    regexp: '^listen ='
    line: 'listen = /run/php/php8.4-fpm.sock'
  notify:
    - Restart php-fpm

- name: Asegurarse de que PHP-FPM y Nginx están corriendo
  service:
    name: "{{ item }}"
    state: restarted
  loop:
    - php8.4-fpm
    - nginx

- name: Activación de los VirtualHost
  file:
    src: /etc/nginx/sites-available/{{item["name"]}}.conf
    dest: /etc/nginx/sites-enabled/{{item["name"]}}.conf
    state: link
  with_items:
    - "{{virtualhosts}}"
  notify: restart nginx


- name: Copiar aplicación Guestbook
  ansible.builtin.copy:
    src: app/
    dest: "/{{ base_web_path }}/"
    owner: www-data
    group: www-data
    mode: '0644'
    directory_mode: '0755'
  
- name: Crear fichero de configuración config.php dentro de la aplicación
  ansible.builtin.template:
    src: config.php.j2
    dest: "/{{ base_web_path }}/config.php"
    owner: www-data
    group: www-data
    
